name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Static checks (no assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:structure

  build:
    name: Build and package (requires assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and package
        if: hashFiles('local-assets/original/**') != ''
        run: |
          npm run build
          npm run package:offline
      - uses: actions/upload-artifact@v4
        if: hashFiles('local-assets/original/**') != ''
        with:
          name: offline-package
          path: release/*.zip
          if-no-files-found: error
